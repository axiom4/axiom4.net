[fcgi-program:axiom4]
socket=tcp://0.0.0.0:8000
directory=/app
command=/app/venv/bin/uvicorn axiom4.asgi:application --root-path /app --fd 0 --access-log --proxy-headers
numprocs=4
process_name=asgi%(process_num)d
autostart=true
autorestart=true
# stdout_logfile=[supervisor.log PATH]
redirect_stderr=true
user=www
